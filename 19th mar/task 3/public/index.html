<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product CRUD Application</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛒 Product CRUD Application</h1>
      <p>Manage your products efficiently</p>
    </header>

    <div class="main-content">
      <!-- Form Section -->
      <section class="form-section">
        <h2>Add/Update Product</h2>
        <form id="productForm">
          <div class="form-group">
            <label for="productId">Product ID (leave empty for new):</label>
            <input type="number" id="productId" placeholder="Auto-generated for new products">
          </div>

          <div class="form-group">
            <label for="productName">Product Name: *</label>
            <input type="text" id="productName" required placeholder="Enter product name">
          </div>

          <div class="form-group">
            <label for="productPrice">Price: *</label>
            <input type="number" id="productPrice" required placeholder="Enter price" step="0.01" min="0">
          </div>

          <div class="form-group">
            <label for="productCategory">Category: *</label>
            <input type="text" id="productCategory" required placeholder="Enter category">
          </div>

          <div class="form-group">
            <label for="productStock">Stock: *</label>
            <input type="number" id="productStock" required placeholder="Enter stock quantity" min="0">
          </div>

          <div class="button-group">
            <button type="submit" id="submitBtn" class="btn btn-primary">Add Product</button>
            <button type="button" id="clearBtn" class="btn btn-secondary">Clear Form</button>
          </div>
        </form>
      </section>

      <!-- Search Section -->
      <section class="search-section">
        <h2>Search & Filter</h2>
        <div class="search-group">
          <input type="text" id="searchInput" placeholder="Search by name or category...">
          <button id="searchBtn" class="btn btn-info">Search</button>
          <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>
      </section>

      <!-- Products Table Section -->
      <section class="products-section">
        <h2>Products List (<span id="productCount">0</span>)</h2>
        <div id="loadingMessage" class="loading" style="display: none;">Loading...</div>
        <div id="errorMessage" class="error" style="display: none;"></div>
        <table id="productsTable" class="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Category</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr>
              <td colspan="6" class="no-data">No products found. Add one to get started!</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <!-- Success Message -->
  <div id="successMessage" class="success-message" style="display: none;"></div>

  <script src="/script.js"></script>
</body>
</html>
