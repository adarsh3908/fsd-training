<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book API Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Book REST API Dashboard</h1>
      <p class="subtitle">Test the REST API to manage books</p>
    </header>

    <div class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav>
          <button class="nav-btn active" data-section="all-books">View All Books</button>
          <button class="nav-btn" data-section="search-book">Search Book</button>
          <button class="nav-btn" data-section="add-book">Add New Book</button>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="content">
        <!-- View All Books Section -->
        <section id="all-books" class="section active">
          <h2>All Books in Database</h2>
          <button class="btn btn-primary" id="refreshBtn">🔄 Refresh</button>
          <div id="allBooksContainer" class="books-list">
            <p>Loading books...</p>
          </div>
        </section>

        <!-- Search Book Section -->
        <section id="search-book" class="section">
          <h2>Search for a Book</h2>
          <div class="form-group">
            <input type="text" id="searchInput" placeholder="Enter book title..." class="input">
            <button class="btn btn-primary" id="searchBtn">🔍 Search</button>
          </div>
          <div id="searchResult" class="result-box"></div>
        </section>

        <!-- Add Book Section -->
        <section id="add-book" class="section">
          <h2>Add a New Book</h2>
          <form id="addBookForm" class="form">
            <div class="form-group">
              <label for="titleInput">Book Title *</label>
              <input type="text" id="titleInput" placeholder="Enter book title" class="input" required>
            </div>
            <div class="form-group">
              <label for="authorInput">Author *</label>
              <input type="text" id="authorInput" placeholder="Enter author name" class="input" required>
            </div>
            <div class="form-group">
              <label for="yearInput">Year Published</label>
              <input type="number" id="yearInput" placeholder="Enter year" class="input">
            </div>
            <button type="submit" class="btn btn-success">➕ Add Book</button>
          </form>
          <div id="addResult" class="result-box"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
